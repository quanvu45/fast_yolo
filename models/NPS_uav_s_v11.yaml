# YOLOv11-style Hybrid 🚀 by Ultralytics, GPL-3.0 license

# Parameters
nc: 1  # number of classes
depth_multiple: 0.33  # model depth multiple
width_multiple: 0.5  # layer channel multiple
backbone1depth: 2  # layer channel multiple
anchors: 4

backbone1:
  # [from, number, module, args]
  [[-1, 1, Conv, [8, 3, 1, 1]],  #0 -P1/2
   [-1, 3, C3k2, [8, False]],    #1 640*640*8
  ]

backbone2:
  # [from, number, module, args]
  [[-1, 1, Conv, [8, 3, 1, 1]],  #2 0-P1/2
   [-1, 3, C3k2, [8, False]],    #3 640*640*8
   [[-1, 1], 1, Concat3, [16, 1]], #4 640*640*16 (Attention Fusion)
   [-1, 3, C3k2, [32, False]],   #5 640*640*32

   [-1, 1, Conv, [64, 3, 2]],    #6 320*320*64
   [-1, 3, C3k2, [64, False]],   #7 320*320*64

   [-1, 1, Conv, [128, 3, 2]],   #8 160*160*128
   [-1, 3, C3k2, [128, False]],  #9 160*160*128

   [-1, 1, Conv, [256, 3, 2]],   #10 80*80*256
   [-1, 3, C3k2, [256, False]],  #11 80*80*256

   [-1, 1, Conv, [512, 3, 2]],   #12 40*40*512
   [-1, 9, C3k2, [512, True]],   #13 40*40*512 (c3k=True for deep layer)
   [-1, 1, SPPF, [512, 5]],      #14 40*40*512
   [-1, 2, C2PSA, [512]],        #15 40*40*512 (Global context)
  ]

# YOLOv5 v6.0 head updated with C3k2
head:
  [[-1, 1, Conv, [256, 1, 1]],   #16 40*40*256
   [-1, 1, nn.Upsample, [None, 2, 'nearest']],  #17 80*80*256
   [[-1, 11], 1, Concat, [1]],   #18 cat backbone P4 80*80*512
   [-1, 3, C3k2, [256, False]],  #19 80*80*256

   [-1, 1, Conv, [128, 1, 1]],   #20 80*80*128
   [-1, 1, nn.Upsample, [None, 2, 'nearest']],  #21 160*160*128
   [[-1, 9], 1, Concat, [1]],    #22 cat backbone P3 160*160*256
   [-1, 3, C3k2, [128, False]],  #23 160*160*128

   [-1, 1, Conv, [64, 1, 1]],    #24 160*160*64
   [-1, 1, nn.Upsample, [None, 2, 'nearest']],  #25 320*320*64
   [[-1, 7], 1, Concat, [1]],    #26 cat backbone P2 320*320*128

   [-1, 3, C3k2, [64, False]],   #27 320*320*64

   [-1, 1, Conv, [64, 3, 2]],    #28 160*160*64
   [[-1, 24], 1, Concat, [1]],   #29 cat head P4 160*160*128
   [-1, 3, C3k2, [128, False]],  #30 160*160*128

   [-1, 1, Conv, [128, 3, 2]],   #31 80*80*128
   [[-1, 20], 1, Concat, [1]],   #32 cat head P5 80*80*256
   [-1, 3, C3k2, [256, False]],  #33 (P5/32-large) 80*80*256

   [-1, 1, Conv, [256, 3, 2]],   #34 40*40*256
   [[-1, 16], 1, Concat, [1]],   #35 cat head P5 40*40*512
   [-1, 3, C3k2, [512, False]],  #36 (P5/32-large) 40*40*512

   [[27, 30, 33, 36], 1, v11Detect, []],  #37 v11Detect(P2, P3, P4, P5)
  ]
